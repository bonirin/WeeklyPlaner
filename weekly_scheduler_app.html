<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weekly Scheduler</title>
  <style>
    :root{
      --bg:#ffffff;
      --panel:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --border:#e2e8f0;
      --shadow: 0 10px 30px rgba(2, 6, 23, 0.08);
      --shadow-sm: 0 6px 18px rgba(2, 6, 23, 0.08);
      --shadow-hover: 0 14px 36px rgba(2, 6, 23, 0.14);
      --radius: 16px;
      --radius-sm: 12px;
      --accent:#2563eb;
      --accent-2:#0ea5e9;
      --danger:#ef4444;
      --ok:#16a34a;
      --warn:#f59e0b;

      --hourHeight: 84px; /* px per hour */
    }

    *{box-sizing:border-box;}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background: var(--bg);
      color: var(--text);
    }

    .app{
      height: 100vh;
      display:flex;
      flex-direction:column;
      overflow: hidden;
    }

    header{
      position: sticky;
      top:0;
      z-index: 50;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .headerInner{
      max-width: 1400px;
      margin: 0 auto;
      padding: 14px 18px 10px;
    }

    .topRow{
      display:flex;
      justify-content:flex-end;
      align-items:center;
      gap:12px;
      margin-bottom: 8px;
    }

    .nowBox{
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      line-height:1.1;
    }
    .nowBox .nowTime{ font-weight: 700; font-size: 18px; }
    .nowBox .nowDate{ color: var(--muted); font-size: 12px; }

    .buttonRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom: 10px;
    }

    .buttonLeft,
    .buttonRight{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .buttonRight{
      justify-content:flex-end;
    }

    .activeNow{
      border: 1px solid rgba(37,99,235,0.22);
      background: linear-gradient(180deg, rgba(239,246,255,0.9) 0%, rgba(248,251,255,0.95) 100%);
      color: #1e3a8a;
      border-radius: 12px;
      padding: 10px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      font-size: 13px;
      font-weight: 700;
      flex-wrap: wrap;
    }

    .activeNow .muted{
      color:#475569;
      font-weight:600;
    }

    .btn{
      appearance:none;
      border:1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 12px;
      padding: 10px 12px;
      font-weight: 600;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:8px;
      box-shadow: 0 1px 0 rgba(2,6,23,0.03);
      transition: transform .05s ease, box-shadow .12s ease, border-color .12s ease;
      user-select:none;
    }
    .btn:hover{ border-color:#cbd5e1; box-shadow: 0 10px 24px rgba(2,6,23,0.06); }
    .btn:active{ transform: translateY(1px); }

    .btn.primary{
      background: linear-gradient(180deg, rgba(37,99,235,1) 0%, rgba(29,78,216,1) 100%);
      border-color: rgba(29,78,216,1);
      color: #fff;
      padding: 12px 16px;
      border-radius: 14px;
      box-shadow: 0 16px 30px rgba(37,99,235,0.22);
    }
    .btn.primary:hover{ box-shadow: 0 22px 42px rgba(37,99,235,0.22); }

    .btn.ghost{
      background: transparent;
    }

    .btn.danger{
      border-color: #fecaca;
      background: #fff;
      color: var(--danger);
    }

    main{
      flex: 1;
      padding: 16px 18px 5vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .wrap{
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .calendarShell{
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow:hidden;
      box-shadow: var(--shadow);
      background: var(--panel);
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .weekGrid{
      display:grid;
      grid-template-columns: 60px repeat(7, 1fr);
      flex: 1;
      overflow-y: hidden;
      overflow-x: auto;
      position: relative;
    }

    .timeColumn{
      border-right: 1px solid var(--border);
      position: relative;
      background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
    }

    .timeColumnHeader{
      padding: 12px 8px 10px;
      border-bottom: 1px solid var(--border);
      text-align: center;
      font-weight: 800;
      font-size: 11px;
      color: var(--muted);
      background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .timeColumnBody{
      position: relative;
      height: calc(var(--workHours) * var(--hourHeight));
    }

    .dayCol{
      border-right: 1px solid var(--border);
      display:flex;
      flex-direction:column;
      min-width: 160px;
    }
    .dayCol:last-child{ border-right:none; }

    .dayCol.today .dayHeader{
      background: linear-gradient(180deg, rgba(239,246,255,1) 0%, rgba(251,253,255,1) 100%);
      border-bottom-color: rgba(37,99,235,0.2);
    }

    .dayHeader{
      padding: 12px 12px 10px;
      border-bottom: 1px solid var(--border);
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:10px;
      background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .dayHeader .dow{
      font-weight: 800;
      letter-spacing: .2px;
    }
    .dayHeader .date{
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .dayBody{
      position: relative;
      height: calc(var(--workHours) * var(--hourHeight));
      background:
        linear-gradient(to bottom, rgba(2,6,23,0.04) 1px, transparent 1px) 0 0 / 100% calc(var(--hourHeight)),
        linear-gradient(to bottom, rgba(2,6,23,0.02), rgba(2,6,23,0.01));
    }

    .hourLabel{
      position:absolute;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 11px;
      color: rgba(100,116,139,0.75);
      pointer-events:none;
      background: rgba(255,255,255,0.55);
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid rgba(226,232,240,0.8);
      white-space: nowrap;
    }

    .timeLine{
      position:absolute;
      left:0;
      right:0;
      height:2px;
      background: linear-gradient(90deg, rgba(37,99,235,0.9), rgba(37,99,235,0.9));
      box-shadow: 0 10px 24px rgba(37,99,235,0.22);
      z-index: 15;
    }
    .timeLine::before{
      content: attr(data-now-label);
      position:absolute;
      left: 65px;
      top: -12px;
      font-size: 10px;
      letter-spacing: .12em;
      color: rgba(37,99,235,0.9);
      font-weight: 800;
      background: rgba(255,255,255,0.85);
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid rgba(37,99,235,0.22);
      white-space: nowrap;
    }

    .taskBlock{
      position:absolute;
      left: 10px;
      right: 10px;
      border: 1px solid rgba(226,232,240,0.95);
      border-radius: 14px;
      background: rgba(255,255,255,0.95);
      box-shadow: var(--shadow-sm);
      padding: 10px 10px 9px;
      overflow:hidden;
      z-index: 4;
      display:flex;
      flex-direction:column;
      gap: 6px;
      cursor: pointer;
      transition: box-shadow 0.5s ease, border-color 0.5s ease;
    }

    .taskBlock:hover{
      box-shadow: var(--shadow-hover);
      border-color: rgba(37,99,235,0.25);
    }

    .taskBlock.current{
      border-color: rgba(37,99,235,0.35);
      box-shadow: 0 18px 38px rgba(37,99,235,0.16);
    }

    .taskBlock.current:hover{
      box-shadow: 0 22px 44px rgba(37,99,235,0.22);
    }

    .taskBlock.compact .taskActionsRow{
      display:none;
    }

    .taskBlock.pastDeadline{
      border-color: rgba(239,68,68,0.5);
      box-shadow: 0 18px 38px rgba(239,68,68,0.16);
    }

    .taskBlock.pastDeadline:hover{
      box-shadow: 0 22px 44px rgba(239,68,68,0.22);
    }

    .taskTitle{
      font-weight: 800;
      font-size: 13px;
      line-height:1.2;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
    }

    .taskMeta{
      font-size: 11px;
      color: var(--muted);
      display:flex;
      align-items:center;
      justify-content:flex-start;
      gap:8px;
    }

    .taskProgress{
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 1;
    }

    .taskProgressFill{
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      background: linear-gradient(180deg, rgba(37,99,235,0.07), rgba(37,99,235,0.18));
    }

    .taskProgressLine{
      position:absolute;
      left:0;
      right:0;
      height:2px;
      background: rgba(37,99,235,0.95);
      box-shadow: 0 6px 14px rgba(37,99,235,0.25);
    }

    .taskContent{
      position: relative;
      z-index: 2;
      display:flex;
      flex-direction:column;
      gap: 6px;
    }

    .taskActionsRow{
      display:flex;
      flex-wrap: wrap;
      gap:4px;
    }

    .taskAction{
      appearance:none;
      border: 1px solid rgba(226,232,240,0.95);
      background:#fff;
      color: var(--text);
      border-radius: 8px;
      padding: 3px 6px;
      font-size: 10px;
      font-weight: 800;
      cursor:pointer;
      line-height:1.1;
      transition: background .12s ease, border-color .12s ease, color .12s ease;
    }

    .taskAction:hover{
      border-color: rgba(37,99,235,0.35);
      background: rgba(239,246,255,0.9);
    }

    .taskAction.ok{
      border-color: rgba(22,163,74,0.3);
      color: var(--ok);
    }

    .taskAction.ok:hover{
      border-color: var(--ok);
      background: rgba(22,163,74,0.08);
    }

    .taskAction.danger{
      border-color: rgba(239,68,68,0.3);
      color: var(--danger);
    }

    .taskAction.danger:hover{
      border-color: var(--danger);
      background: rgba(239,68,68,0.08);
    }

    .chip{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(226,232,240,0.95);
      font-weight: 700;
      font-size: 11px;
      color: rgba(15,23,42,0.82);
      background: rgba(248,250,252,0.9);
    }

    .breakBlock{
      position:absolute;
      left: 10px;
      right: 10px;
      border: 2px dashed rgba(100,116,139,0.4);
      border-radius: 14px;
      background: repeating-linear-gradient(
        45deg,
        rgba(248,250,252,0.5),
        rgba(248,250,252,0.5) 10px,
        rgba(226,232,240,0.3) 10px,
        rgba(226,232,240,0.3) 20px
      );
      z-index: 3;
      display:flex;
      align-items:center;
      justify-content:center;
      position: relative;
      min-height: 40px;
    }

    .breakBlock .breakLabel{
      font-weight: 800;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: rgba(255,255,255,0.9);
      padding: 4px 12px;
      border-radius: 999px;
      border: 1px solid rgba(226,232,240,0.8);
    }

    .breakBlock .removeBreak{
      position: absolute;
      top: 8px;
      right: 8px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      color: var(--danger);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: all 0.2s ease;
    }

    .breakBlock .removeBreak:hover{
      background: rgba(239,68,68,0.2);
      border-color: var(--danger);
    }

    .breakBlock .resizeHandle{
      position: absolute;
      left: 0;
      right: 0;
      height: 8px;
      cursor: ns-resize;
      z-index: 5;
    }

    .breakBlock .resizeHandle.top{
      top: 0;
    }

    .breakBlock .resizeHandle.bottom{
      bottom: 0;
    }

    .breakBlock .resizeHandle:hover::before{
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 30px;
      height: 3px;
      background: rgba(100,116,139,0.4);
      border-radius: 999px;
    }

    .taskEdge{
      position: absolute;
      left: 0;
      right: 0;
      height: 6px;
      cursor: pointer;
      z-index: 5;
      transition: background 0.2s ease;
    }

    .taskEdge.top{
      top: 0;
      border-radius: 14px 14px 0 0;
    }

    .taskEdge.bottom{
      bottom: 0;
      border-radius: 0 0 14px 14px;
    }

    .taskEdge:hover{
      background: rgba(100,116,139,0.15);
    }

    .segmentConnector{
      position:absolute;
      left: 10px;
      right: 10px;
      height: 10px;
      transform: translateY(-5px);
      background: transparent;
      border: none;
      padding: 0;
      cursor:pointer;
      z-index: 3;
    }

    .segmentConnector::before{
      content:'';
      position:absolute;
      left:0;
      right:0;
      top:50%;
      transform: translateY(-50%);
      height: 1px;
      background: transparent;
      transition: background .2s ease;
    }

    .segmentConnector:hover::before{
      background: rgba(100,116,139,0.65);
    }

    .modal{
      position:fixed;
      top:0;
      left:0;
      right:0;
      bottom:0;
      z-index:999;
      background: rgba(15,23,42,0.38);
      backdrop-filter: blur(6px);
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding: 60px 20px 40px;
      overflow:auto;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn{
      from{
        opacity: 0;
      }
      to{
        opacity: 1;
      }
    }

    .modalBox{
      background: var(--panel);
      border-radius: var(--radius);
      box-shadow: 0 24px 70px rgba(2,6,23,0.24);
      width: 100%;
      max-width: 560px;
      border: 1px solid var(--border);
      animation: slideUp 0.5s ease;
      opacity: 0;
      animation-fill-mode: forwards;
    }

    @keyframes slideUp{
      from{
        opacity: 0;
        transform: translateY(-50px);
      }
      to{
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modalHeader{
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    .modalHeader h2{
      margin:0;
      font-size: 18px;
      font-weight: 800;
    }

    .modalClose{
      appearance:none;
      background:transparent;
      border:none;
      color: var(--muted);
      font-size: 24px;
      cursor:pointer;
      line-height:1;
      padding:0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display:flex;
      align-items:center;
      justify-content:center;
      transition: background .12s ease, color .12s ease;
    }
    .modalClose:hover{
      background: rgba(100,116,139,0.1);
      color: var(--text);
    }

    .modalTabs{
      display:flex;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #fafbfc 0%, #ffffff 100%);
      padding: 0 20px;
      gap:4px;
    }
    .modalTab{
      appearance:none;
      background:transparent;
      border:none;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      padding: 12px 16px;
      cursor:pointer;
      position:relative;
      transition: color .12s ease;
    }
    .modalTab:hover{
      color: var(--text);
    }
    .modalTab.active{
      color: var(--accent);
    }
    .modalTab.active::after{
      content:'';
      position:absolute;
      bottom:0;
      left:0;
      right:0;
      height:3px;
      background: var(--accent);
      border-radius: 999px 999px 0 0;
    }

    .modalBody{
      padding: 20px;
      max-height: 70vh;
      overflow-y: auto;
    }

    label{
      display:block;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin-bottom:6px;
    }

    input[type=text],
    input[type=datetime-local],
    input[type=number],
    select{
      appearance:none;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
      background: #fff;
      color: var(--text);
      width: 100%;
      transition: border-color .12s ease, box-shadow .12s ease;
    }
    input[type=text]:focus,
    input[type=datetime-local]:focus,
    input[type=number]:focus,
    select:focus{
      outline:none;
      border-color: var(--accent);
      box-shadow: 0 8px 20px rgba(37,99,235,0.08);
    }

    textarea{
      appearance:none;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
      background: #fff;
      color: var(--text);
      width: 100%;
      resize:vertical;
      min-height: 80px;
      transition: border-color .12s ease, box-shadow .12s ease;
    }
    textarea:focus{
      outline:none;
      border-color: var(--accent);
      box-shadow: 0 8px 20px rgba(37,99,235,0.08);
    }

    input[type=file]{
      appearance:none;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
      background: #fff;
      color: var(--text);
      width: 100%;
      cursor:pointer;
    }

    .row{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .grid2{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:12px;
    }

    .divider{
      height:1px;
      background: var(--border);
      margin: 18px 0;
    }

    .hintBox{
      background: rgba(14,165,233,0.08);
      border: 1px solid rgba(14,165,233,0.22);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-size: 13px;
      line-height:1.5;
      color: rgba(15,23,42,0.82);
    }

    .inlineSmall{
      font-size: 11px;
      color: var(--muted);
      line-height:1.4;
    }

    .taskList{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .taskItem{
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      background: #fff;
      box-shadow: 0 4px 12px rgba(2,6,23,0.04);
      transition: box-shadow .12s ease, border-color .12s ease;
    }
    .taskItem:hover{
      border-color:#cbd5e1;
      box-shadow: 0 8px 20px rgba(2,6,23,0.06);
    }

    .taskItemTop{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      margin-bottom:8px;
    }

    .taskItemName{
      font-weight: 800;
      font-size: 14px;
      flex:1;
    }

    .taskItemActions{
      display:flex;
      gap:6px;
    }

    .iconBtn{
      appearance:none;
      background:transparent;
      border:1px solid var(--border);
      color: var(--muted);
      border-radius: 8px;
      padding: 6px;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      transition: background .12s ease, color .12s ease, border-color .12s ease;
      line-height:1;
    }
    .iconBtn:hover{
      background: rgba(100,116,139,0.08);
      color: var(--text);
      border-color:#cbd5e1;
    }

    .iconBtn.ok{ color: var(--ok); border-color: rgba(22,163,74,0.3); }
    .iconBtn.ok:hover{ background: rgba(22,163,74,0.1); border-color: var(--ok); }

    .iconBtn.danger{ color: var(--danger); border-color: rgba(239,68,68,0.3); }
    .iconBtn.danger:hover{ background: rgba(239,68,68,0.1); border-color: var(--danger); }

    .taskItemMeta{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      font-size: 12px;
      color: var(--muted);
    }

    .emptyState{
      padding: 60px 20px;
      text-align:center;
      color: var(--muted);
    }
    .emptyState .emptyIcon{
      font-size: 48px;
      margin-bottom:12px;
      opacity:0.5;
    }
    .emptyState .emptyText{
      font-size: 14px;
      font-weight: 600;
    }

  </style>
</head>
<body>
  <div class="app" id="app"></div>

<script src="weekly_scheduler_app_v2.js"></script>
</body>
</html>
